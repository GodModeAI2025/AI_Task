name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python3 tools/check.py
      - run: git diff --exit-code -- dist/ docs/ai-task.skill docs/ai-task.skill.sha256
